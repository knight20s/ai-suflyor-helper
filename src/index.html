<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Suflyor</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <nav class="tabs">
      <span class="tab wide">PROBLEMS</span>
      <span class="tab wide">OUTPUT</span>
      <span class="tab wide extra">DEBUG CONSOLE</span>
      <span class="tab active">TERMINAL</span>
      <span class="tab wide extra">PORTS</span>
    </nav>
    <div class="actions">
      <span class="term-name">
        <svg viewBox="0 0 16 16"><path d="M2.5 4.5 6 8l-3.5 3.5M8 12h5.5"/></svg>
        <span>claude</span>
      </span>
      <button id="btn-listen" class="icon" title="Слушать / пауза">
        <svg viewBox="0 0 16 16"><path d="M8 10.2a2.4 2.4 0 0 0 2.4-2.4V3.9a2.4 2.4 0 0 0-4.8 0v3.9A2.4 2.4 0 0 0 8 10.2Z"/><path d="M4 7.6a4 4 0 0 0 8 0M8 11.8v2.4M5.6 14.2h4.8"/></svg>
      </button>
      <button id="btn-save" class="icon" title="Скачать чат сессии">
        <svg viewBox="0 0 16 16"><path d="M8 2v8.2M4.6 7l3.4 3.4L11.4 7M2.8 11.2v2h10.4v-2"/></svg>
      </button>
      <button id="btn-pin" class="icon" title="Закрепить окно на месте">
        <svg viewBox="0 0 16 16"><path d="M5.5 1.8h5M6.6 1.8v4.3L4.4 9.3h7.2L9.4 6.1V1.8M8 9.3v5"/></svg>
      </button>
      <button id="btn-settings" class="icon" title="Настройки">
        <svg viewBox="0 0 16 16"><path d="M6.77 3.05L6.94 1.28L9.06 1.28L9.23 3.05A5.1 5.1 0 0 1 10.63 3.63L10.63 3.63L12.00 2.50L13.50 4.00L12.37 5.37A5.1 5.1 0 0 1 12.95 6.77L12.95 6.77L14.72 6.94L14.72 9.06L12.95 9.23A5.1 5.1 0 0 1 12.37 10.63L12.37 10.63L13.50 12.00L12.00 13.50L10.63 12.37A5.1 5.1 0 0 1 9.23 12.95L9.23 12.95L9.06 14.72L6.94 14.72L6.77 12.95A5.1 5.1 0 0 1 5.37 12.37L5.37 12.37L4.00 13.50L2.50 12.00L3.63 10.63A5.1 5.1 0 0 1 3.05 9.23L3.05 9.23L1.28 9.06L1.28 6.94L3.05 6.77A5.1 5.1 0 0 1 3.63 5.37L3.63 5.37L2.50 4.00L4.00 2.50L5.37 3.63A5.1 5.1 0 0 1 6.77 3.05Z"/><circle cx="8" cy="8" r="2.1"/></svg>
      </button>
      <button id="btn-min" class="icon" title="Свернуть">
        <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
      </button>
      <button id="btn-close" class="icon close" title="Закрыть">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <section id="feed">
    <div id="status">
      <span id="dot" class="off"></span>
      <span id="status-text">выключено</span>
      <div id="meter"><i></i></div>
      <button id="mode" class="chip" title="Когда отправлять в Claude"></button>
      <button id="btn-flush" class="chip" title="Отправить накопленное в Claude" hidden>отправить</button>
      <button id="btn-clear" class="chip" title="Очистить накопленное">очистить</button>
    </div>
    <div id="lines"></div>
  </section>

  <main id="term"></main>

  <div id="settings" hidden>
    <form id="form" autocomplete="off">
      <h2>Настройки</h2>
      <p class="hint">Речь распознаётся локально на этом компьютере через Whisper, без ключей и облака. В Claude уходит только готовый текст.</p>

      <div class="group">
        <h3>Распознавание</h3>
        <label>Модель Whisper
          <select name="whisperModel">
            <option value="base-q5_1">base - очень быстро, 60 МБ, качество так себе</option>
            <option value="small-q5_1">small - баланс скорости и качества, 190 МБ</option>
            <option value="small">small без сжатия - чуть точнее, 470 МБ</option>
            <option value="medium-q5_0">medium - точнее, 540 МБ, нужен быстрый процессор</option>
            <option value="large-v3-turbo-q5_0">large-v3-turbo - лучшее качество, 550 МБ, медленно на слабом ПК</option>
          </select>
        </label>
        <label>Язык собеседника
          <select name="language">
            <option value="ru">русский</option>
            <option value="uk">украинский</option>
            <option value="en">английский</option>
            <option value="auto">автоопределение</option>
          </select>
        </label>
        <label>Потоки процессора, 0 = авто <input name="whisperThreads" type="number" min="0" max="32"></label>
      </div>

      <div class="group">
        <h3>Звук</h3>
        <label>Источник <select name="source"></select></label>
        <label>Когда отправлять в Claude
          <select name="mode">
            <option value="questions">автоматически, только вопросы</option>
            <option value="all">автоматически, каждую фразу</option>
            <option value="manual">вручную, кнопкой «отправить»</option>
          </select>
        </label>
        <label>Пауза конца фразы <output data-for="silenceMs"></output>
          <input name="silenceMs" type="range" min="300" max="2000" step="50">
        </label>
        <label>Чувствительность <output data-for="sensitivity"></output>
          <input name="sensitivity" type="range" min="0.5" max="4" step="0.1">
        </label>
      </div>

      <div class="group">
        <h3>Окно</h3>
        <label>Прозрачность <output data-for="opacity"></output>
          <input name="opacity" type="range" min="0.4" max="1" step="0.01">
        </label>
        <label>Размер шрифта терминала <input name="fontSize" type="number" min="9" max="30"></label>
        <label class="check"><input name="hideFromCapture" type="checkbox"> Скрывать окно в демонстрации экрана и на записи</label>
      </div>

      <div class="group">
        <h3>Claude Code</h3>
        <label>Команда <input name="claudeCommand" spellcheck="false"></label>
        <label>Аргументы <input name="claudeArgs" spellcheck="false"></label>
        <label>Системный промпт <textarea name="systemPrompt" rows="14"></textarea></label>
        <label>Шаблон сообщения, {text} заменится на речь <input name="messageTemplate" spellcheck="false"></label>
      </div>

      <div class="buttons">
        <button type="submit" class="primary">Сохранить</button>
        <button type="button" id="btn-cancel">Отмена</button>
        <button type="button" id="btn-restart">Перезапустить Claude</button>
      </div>
    </form>
  </div>
</div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="speech.js"></script>
<script src="audio.js"></script>
<script src="renderer.js"></script>
</body>
</html>
